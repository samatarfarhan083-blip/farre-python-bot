name: Run Binance Spot Bot

on:
  schedule:
    - cron: '0 * * * *' # Wuxuu shaqeynayaa saacad kasta
  workflow_dispatch: # Waxaad sidoo kale gacanta uga billaabi kartaa badhan markaad rabto

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py
